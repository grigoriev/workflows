# zizmor configuration, used by the lint job in ci.yml.
rules:
  # The Claude workflows pass CLAUDE_CODE_OAUTH_TOKEN without an environment.
  # Fork pull requests get no secrets and need approval to run at all.
  secrets-outside-env:
    ignore:
      - claude-review.yml
      - claude-code-review.yml
  # claude-code-action needs git credentials to fetch the pull request branch.
  # The runner is ephemeral and the token expires with the job.
  artipacked:
    ignore:
      - claude-review.yml
  # zizmor suggests the new $/ syntax for workflows of this repository.
  # actionlint does not know it yet, so keep ./ for now.
  self-repository:
    disable: true
